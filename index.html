<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Barnardo Ntaganira Herve — Full-Stack Developer portfolio">
  <title>Barnardo Ntaganira Herve | Full-Stack Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="top">
    <nav class="nav container">
      <a href="#top" class="nav-logo">&lt;/&gt; BN<span class="accent">.</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="#top">Home</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#stack">Stack</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <a href="#contact" class="btn btn-primary nav-cta">Let's Talk ↗</a>
    </nav>
  </header>

  <main>
    <section class="hero container" id="hero">
      <div class="hero-content">
        <span class="hero-badge" id="heroBadge"></span>
        <h1 class="hero-headline" id="heroHeadline"></h1>
        <p class="hero-summary" id="heroSummary"></p>
        <div class="hero-actions">
          <a href="#projects" class="btn btn-primary">View Projects ↗</a>
          <a href="#" class="btn btn-outline" id="downloadCv">Download CV ↓</a>
        </div>
        <div class="hero-stack">
          <p class="hero-stack-label">Technologies I Work With</p>
          <div class="hero-stack-icons" id="heroStack"></div>
        </div>
      </div>
      <div class="hero-visual">
        <div class="hero-glow" aria-hidden="true"></div>
        <img
          src="image/bardo_herve.png"
          alt="Barnardo Ntaganira Herve — Full-Stack Developer"
          class="hero-photo"
          width="788"
          height="1280"
        >
      </div>
    </section>

    <section class="section container" id="projects">
      <h2 class="section-title section-title-center">Projects</h2>
      <p class="section-intro section-intro-center">Systems I designed and built — from banking channels to payment middleware.</p>
      <div class="projects-list" id="projectsList"></div>
    </section>

    <section class="section container" id="stack">
      <h2 class="section-title section-title-center">Stack</h2>
      <p class="section-intro section-intro-center" id="stackIntro"></p>
      <div class="stack-grid" id="stackGrid"></div>
    </section>

    <section class="section container" id="about">
      <div class="about-layout">
        <h2 class="section-title section-title-center" id="aboutHeading"></h2>
        <div class="about-cards-grid" id="aboutCardsGrid"></div>
        <div class="stats-row" id="statsGrid"></div>
        <div class="credentials-grid" id="credentialsGrid"></div>
      </div>
    </section>

    <section class="section container section-compact" id="background">
      <h2 class="section-title section-title-center">Where I've Worked</h2>
      <p class="section-intro section-intro-center" id="backgroundIntro"></p>
      <div class="background-timeline" id="backgroundTimeline"></div>
    </section>
  </main>

  <footer class="site-footer" id="contact">
    <div class="container footer-grid">
      <div class="footer-col footer-cta">
        <h3 class="footer-heading" id="footerCtaHeading"></h3>
        <a href="#contact" class="btn btn-primary" id="footerCtaBtn"></a>
      </div>
      <div class="footer-col footer-testimonial">
        <blockquote class="testimonial" id="testimonial"></blockquote>
      </div>
      <div class="footer-col footer-social">
        <h3 class="footer-label">Follow Me</h3>
        <div class="social-links" id="socialLinks"></div>
        <div class="footer-contact" id="footerContact"></div>
      </div>
    </div>
    <div class="footer-bottom">
      <div class="container">
        <p id="footerCopyright"></p>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
